<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rain的Aemeath知识库</title>
  <meta name="description" content="Rain 的个人知识库 · 在星海轻歌的电子幽灵">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90' fill='%237fd6ff'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css?v=20261017d">
</head>
<body>
  <!-- 星海背景 -->
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <div class="layout">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <a class="brand" href="#home" data-home>
          <span class="cd-frame" aria-hidden="true"><img class="brand-cd" src="assets/fleet-cd.png" alt="Fleet Snowfluff CD"></span>
          <span class="brand-text">
            <span class="brand-title" id="brandTitle">Rain的Aemeath知识库</span>
            <span class="brand-sub" id="brandSub">在星海轻歌的电子幽灵</span>
            <span class="brand-en" aria-hidden="true">Fleet Snow<span class="sf">✻</span>fluff</span>
          </span>
        </a>
        <button class="icon-btn sidebar-close" id="sidebarClose" type="button" aria-label="收起目录">✕</button>
      </div>

      <div class="search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="搜索知识库…" autocomplete="off" spellcheck="false">
      </div>

      <button class="side-back" id="sideBack" type="button">← 返回上一页</button>

      <a class="upload-entry" href="#upload">✎ 上传资料</a>

      <nav class="toc" id="toc" aria-label="目录"></nav>

      <div class="sidebar-foot" aria-hidden="true">
        <span>❄ 星海 · 长航 · 飞行雪绒 ❄</span>
        <span class="credit">Q版 © 库洛游戏 · 像素桌宠 © sinlatansen</span>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="backdrop" aria-hidden="true"></div>

    <!-- 主内容 -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn sidebar-open" id="sidebarOpen" type="button" aria-label="打开目录">☰</button>
        <div class="crumb" id="crumb"></div>
        <div class="topbar-spacer"></div>
        <span class="topbar-tag" aria-hidden="true">✦ 电子幽灵 · 在线</span>
      </header>

      <section class="hero" id="hero" aria-label="网站头图">
        <div class="hero-inner">
          <div class="hero-avatar" aria-hidden="true">
            <span class="hero-avatar-ring"></span>
            <img class="hero-avatar-img" src="assets/aemeath-avatar.png" alt="爱弥斯 Q版团子">
          </div>
          <div class="hero-info">
            <h1 class="hero-title" id="heroTitle">Rain的Aemeath知识库</h1>
            <p class="hero-sub" id="heroSub">在星海轻歌的电子幽灵</p>
            <p class="hero-meta" id="heroMeta">星炬学院 · 校园歌手 · 飞行雪绒</p>
            <div class="hero-chips" id="heroChips"></div>
          </div>
          <div class="song-wave" id="songWave" aria-hidden="true"></div>
        </div>
      </section>

      <div class="pinned-wrap" id="pinnedWrap" aria-label="置顶动态">
        <div class="pinned-card">
          <img class="pinned-sticker" src="assets/aemeath-love.png" alt="爱弥斯爱心表情">
          <div class="pinned-head"><img class="pinned-avatar" src="assets/pet-mascot-trim.png" alt=""><span class="pinned-badge">置顶</span><span class="pinned-label" id="pinnedLabel">星海广播</span></div>
          <p class="pinned-body" id="pinnedBody">今晚的星海很安静，适合写一首新歌。</p>
          <div class="pinned-sign" id="pinnedSign">—— 电子幽灵 · 爱弥斯</div>
        </div>
      </div>

      <article class="content" id="content">
        <div class="loading">✦ 载入中…</div>
      </article>

      <footer class="page-nav" id="pageNav"></footer>
    </main>
  </div>

  <div class="pet" id="pet" role="button" tabindex="0" aria-label="爱弥斯桌宠，点我说话">
    <div class="pet-sprite" id="petSprite" aria-hidden="true"></div>
    <img class="pet-love" id="petLove" src="assets/aemeath-love.png" alt="">
    <span class="pet-bubble" id="petBubble">在星海轻歌~</span>
  </div>

  <script src="config.js?v=20261017d"></script>
  <script src="assets/app.js?v=20261017d"></script>
</body>
</html>
