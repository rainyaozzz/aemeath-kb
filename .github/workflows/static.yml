name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate approved public files
        shell: python
        run: |
          import json, pathlib, re
          root = pathlib.Path("public")
          approved = set(json.loads(pathlib.Path(".github/pages-files.json").read_text()))
          files = [p for p in root.rglob("*") if p.is_file()]
          assert not any(p.is_symlink() for p in root.rglob("*")), "Symlinks forbidden"
          assert {p.relative_to(root).as_posix() for p in files} == approved, "Public file allowlist mismatch"
          for p in files:
              assert not re.search(r"(?i)(server\.py|__pycache__|\.env|\.pyc$|draft|secret|AGENTS\.md)", p.as_posix()), "Forbidden file"
          assert (root / "index.html").is_file()
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
